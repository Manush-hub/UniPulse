<!DOCTYPE html>
<html>
<head>
    <title>Simple Cover Upload Test</title>
</head>
<body>
    <h2>Simple Cover Upload Test</h2>
    <input type="file" id="coverInput" accept="image/*">
    <button onclick="testUpload()">Upload</button>
    <div id="result"></div>
    <div id="logs"></div>

    <script>
        function addLog(message) {
            const logs = document.getElementById('logs');
            logs.innerHTML += '<p>' + new Date().toLocaleTimeString() + ': ' + message + '</p>';
            console.log(message);
        }

        function testUpload() {
            const fileInput = document.getElementById('coverInput');
            const file = fileInput.files[0];
            
            addLog('testUpload called');
            addLog('File: ' + (file ? file.name : 'NO FILE'));
            
            if (!file) {
                alert('Please select a file');
                return;
            }

            const formData = new FormData();
            formData.append('image', file);
            
            addLog('FormData created, starting fetch...');

            fetch('/unipulse/public/publisher/profile/uploadCoverPhoto', {
                method: 'POST',
                body: formData
            })
            .then(response => {
                addLog('Response status: ' + response.status);
                addLog('Response ok: ' + response.ok);
                return response.text();
            })
            .then(text => {
                addLog('Response text: ' + text);
                try {
                    const data = JSON.parse(text);
                    addLog('Parsed JSON: ' + JSON.stringify(data));
                    document.getElementById('result').innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
                } catch(e) {
                    addLog('JSON parse error: ' + e.message);
                    document.getElementById('result').innerHTML = '<pre>' + text + '</pre>';
                }
            })
            .catch(error => {
                addLog('Fetch error: ' + error.message);
                document.getElementById('result').innerHTML = '<p style="color:red">Error: ' + error.message + '</p>';
            });
        }
    </script>
</body>
</html>
