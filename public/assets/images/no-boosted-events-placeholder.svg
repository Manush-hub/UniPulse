<svg width="1920" height="600" viewBox="0 0 1920 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A8A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F97316;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="orangeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FBBF24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F97316;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lightGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0.6" />
    </linearGradient>
  </defs>
  
  <!-- Background Image -->
  <image href="https://images.unsplash.com/photo-1540575467063-178a50c2df87?ixlib=rb-4.0.3&amp;auto=format&amp;fit=crop&amp;w=1920&amp;q=80" width="1920" height="600" preserveAspectRatio="xMidYMid slice"/>
  
  <!-- Overlay for better text visibility -->
  <rect width="1920" height="600" fill="url(#bgGradient)" opacity="0.85"/>
  
  <!-- Decorative Pattern -->
  <g opacity="0.05">
    <circle cx="150" cy="100" r="60" fill="#FFFFFF"/>
    <circle cx="1780" cy="500" r="80" fill="#FFFFFF"/>
    <circle cx="1700" cy="80" r="50" fill="#FFFFFF"/>
    <circle cx="250" cy="520" r="40" fill="#FFFFFF"/>
    <rect x="100" y="250" width="80" height="80" rx="10" fill="#FFFFFF"/>
    <rect x="1750" y="200" width="60" height="60" rx="8" fill="#FFFFFF"/>
  </g>
  
  <!-- Left Side Event Icons -->
  <g transform="translate(200, 220)" opacity="0.15">
    <!-- Calendar -->
    <rect x="0" y="10" width="80" height="90" rx="8" fill="#FFFFFF"/>
    <rect x="0" y="10" width="80" height="25" rx="8" fill="#F97316"/>
    <circle cx="20" cy="8" r="4" fill="#FFFFFF"/>
    <circle cx="60" cy="8" r="4" fill="#FFFFFF"/>
    <text x="40" y="70" font-family="Arial" font-size="32" font-weight="bold" fill="#F97316" text-anchor="middle">20</text>
  </g>
  
  <!-- Right Side Event Icons -->
  <g transform="translate(1640, 220)" opacity="0.15">
    <!-- Megaphone -->
    <path d="M0 40 L30 20 L70 20 L70 60 L30 60 L0 40 M70 30 L90 20 M70 40 L95 40 M70 50 L90 60" 
          stroke="#FFFFFF" stroke-width="6" fill="none" stroke-linecap="round"/>
    <circle cx="0" cy="40" r="8" fill="#FFFFFF"/>
  </g>
  
  <!-- Central Focus Area -->
  <g transform="translate(960, 200)">
    <!-- Large Rocket/Boost Icon -->
    <g transform="translate(-50, -30)">
      <!-- Rocket Body -->
      <path d="M50 0 L70 60 L50 55 L30 60 Z" fill="url(#orangeGlow)"/>
      <ellipse cx="50" cy="25" rx="8" ry="12" fill="#FFFFFF" opacity="0.9"/>
      <!-- Flames -->
      <path d="M35 60 L30 75 L35 70" fill="#FBBF24" opacity="0.8"/>
      <path d="M50 55 L50 80 L50 70" fill="#F97316" opacity="0.9"/>
      <path d="M65 60 L70 75 L65 70" fill="#FBBF24" opacity="0.8"/>
      <!-- Stars around rocket -->
      <circle cx="20" cy="20" r="3" fill="#FBBF24"/>
      <circle cx="85" cy="15" r="2.5" fill="#FFFFFF" opacity="0.8"/>
      <circle cx="15" cy="45" r="2" fill="#FFFFFF" opacity="0.7"/>
      <circle cx="90" cy="50" r="3" fill="#FBBF24"/>
    </g>
    
    <!-- Pulse Rings -->
    <circle cx="0" cy="0" r="80" stroke="#FFFFFF" stroke-width="2" fill="none" opacity="0.2"/>
    <circle cx="0" cy="0" r="110" stroke="#FFFFFF" stroke-width="1.5" fill="none" opacity="0.15"/>
    <circle cx="0" cy="0" r="140" stroke="#FFFFFF" stroke-width="1" fill="none" opacity="0.1"/>
  </g>
  
  <!-- UniPulse Brand Badge -->
  <g transform="translate(860, 80)">
    <rect x="0" y="0" width="200" height="50" rx="25" fill="#FFFFFF" opacity="0.15"/>
    <text x="100" y="33" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
      UNIPULSE
    </text>
  </g>
  
  <!-- Main Title -->
  <text x="960" y="360" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
    Boost Your Event to Stand Out!
  </text>
  
  <!-- Subtitle -->
  <text x="960" y="410" font-family="Arial, sans-serif" font-size="22" fill="#FFFFFF" opacity="0.95" text-anchor="middle">
    No boosted events currently — Be the first to amplify your reach and attract more participants!
  </text>
  
  <!-- Call to Action Hint -->
  <g transform="translate(960, 470)">
    <rect x="-180" y="-25" width="360" height="50" rx="25" fill="#FFFFFF" opacity="0.1"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="18" fill="#FBBF24" text-anchor="middle" font-weight="600">
      💡 Go to Dashboard → Boost Your Events
    </text>
  </g>
  
  <!-- Bottom Decorative Icons -->
  <g transform="translate(400, 530)" opacity="0.2">
    <!-- Ticket Icon -->
    <rect x="0" y="0" width="60" height="35" rx="5" stroke="#FFFFFF" stroke-width="2" fill="none"/>
    <line x1="20" y1="0" x2="20" y2="35" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="3,3"/>
    <circle cx="10" cy="17.5" r="3" fill="#FFFFFF"/>
  </g>
  
  <g transform="translate(1460, 530)" opacity="0.2">
    <!-- Users/Audience Icon -->
    <circle cx="15" cy="10" r="8" fill="#FFFFFF"/>
    <circle cx="45" cy="10" r="8" fill="#FFFFFF"/>
    <path d="M0 35 Q15 20, 30 35" fill="#FFFFFF"/>
    <path d="M30 35 Q45 20, 60 35" fill="#FFFFFF"/>
  </g>
  
  <!-- Corner Accent Lines -->
  <path d="M100 100 L200 100 L200 200" stroke="#FFFFFF" stroke-width="3" opacity="0.1" fill="none" stroke-linecap="round"/>
  <path d="M1820 500 L1720 500 L1720 400" stroke="#FFFFFF" stroke-width="3" opacity="0.1" fill="none" stroke-linecap="round"/>
</svg>