<!DOCTYPE html>
<html>
<head>
    <title>Test API Endpoint</title>
</head>
<body>
    <h2>Test Moderator Pending Approvals API</h2>
    <button onclick="testAPI(10)">Test Moderator ID 10 (should have pending)</button>
    <button onclick="testAPI(11)">Test Moderator ID 11 (should be clear)</button>
    <div id="result"></div>

    <script>
        async function testAPI(moderatorId) {
            try {
                const response = await fetch(`/unipulse/public/admin/moderators/check_pending/${moderatorId}`);
                const data = await response.json();
                
                document.getElementById('result').innerHTML = `
                    <h3>Results for Moderator ID ${moderatorId}:</h3>
                    <p><strong>Has Pending:</strong> ${data.hasPending}</p>
                    <p><strong>Pending Count:</strong> ${data.pendingCount}</p>
                `;
            } catch (error) {
                document.getElementById('result').innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
