<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Image Upload - Publisher Profile</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .test-box {
            border: 2px solid #ddd;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
        }
        .image-preview {
            width: 300px;
            height: 200px;
            border: 2px dashed #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 10px 0;
            overflow: hidden;
        }
        .image-preview img {
            max-width: 100%;
            max-height: 100%;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #0056b3;
        }
        .success {
            color: green;
            font-weight: bold;
        }
        .error {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Test Publisher Profile Image Upload</h1>
    
    <div class="test-box">
        <h2>Step 1: Check Profile Data</h2>
        <button onclick="checkProfileData()">Check Profile Data</button>
        <div id="profileCheck"></div>
    </div>

    <div class="test-box">
        <h2>Step 2: Upload Profile Logo</h2>
        <input type="file" id="logoFile" accept="image/*">
        <button onclick="uploadLogo()">Upload Logo</button>
        <div class="image-preview" id="logoPreview">No image</div>
        <div id="logoResult"></div>
    </div>

    <div class="test-box">
        <h2>Step 3: Upload Cover Photo</h2>
        <input type="file" id="coverFile" accept="image/*">
        <button onclick="uploadCover()">Upload Cover</button>
        <div class="image-preview" id="coverPreview">No image</div>
        <div id="coverResult"></div>
    </div>

    <div class="test-box">
        <h2>Step 4: Verify in Database</h2>
        <button onclick="verifyDatabase()">Check Database</button>
        <div id="dbResult"></div>
    </div>

    <div class="test-box">
        <h2>Step 5: View Actual Profile</h2>
        <button onclick="window.open('/unipulse/public/publisher/profile', '_blank')">Open Profile Page</button>
        <p>Check if images are visible on the actual profile page</p>
    </div>

    <script>
        function checkProfileData() {
            const result = document.getElementById('profileCheck');
            result.innerHTML = 'Loading...';
            
            fetch('/unipulse/public/publisher/profile/getProfileData')
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        const profile = data.data.profile;
                        result.innerHTML = `
                            <div class="success">✓ Profile data loaded</div>
                            <p><strong>Logo URL:</strong> ${profile.logo_url || 'Not set'}</p>
                            <p><strong>Cover URL:</strong> ${profile.cover_photo_url || 'Not set'}</p>
                            ${profile.logo_url ? `<img src="${profile.logo_url}" width="100" style="border:1px solid #ccc">` : ''}
                        `;
                    } else {
                        result.innerHTML = `<div class="error">✗ ${data.message}</div>`;
                    }
                })
                .catch(error => {
                    result.innerHTML = `<div class="error">✗ Error: ${error.message}</div>`;
                });
        }

        function uploadLogo() {
            const fileInput = document.getElementById('logoFile');
            const result = document.getElementById('logoResult');
            const preview = document.getElementById('logoPreview');
            
            if (!fileInput.files.length) {
                result.innerHTML = '<div class="error">Please select a file first</div>';
                return;
            }

            const file = fileInput.files[0];
            
            // Show preview
            const reader = new FileReader();
            reader.onload = (e) => {
                preview.innerHTML = `<img src="${e.target.result}" alt="Logo Preview">`;
            };
            reader.readAsDataURL(file);

            // Upload
            const formData = new FormData();
            formData.append('image', file);
            
            result.innerHTML = 'Uploading...';

            fetch('/unipulse/public/publisher/profile/uploadProfileImage', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    result.innerHTML = `
                        <div class="success">✓ ${data.message}</div>
                        <p><strong>Image URL:</strong> ${data.imageUrl}</p>
                        <img src="${data.imageUrl}" width="100" style="border:1px solid #ccc">
                    `;
                } else {
                    result.innerHTML = `<div class="error">✗ ${data.message}</div>`;
                }
            })
            .catch(error => {
                result.innerHTML = `<div class="error">✗ Error: ${error.message}</div>`;
            });
        }

        function uploadCover() {
            const fileInput = document.getElementById('coverFile');
            const result = document.getElementById('coverResult');
            const preview = document.getElementById('coverPreview');
            
            if (!fileInput.files.length) {
                result.innerHTML = '<div class="error">Please select a file first</div>';
                return;
            }

            const file = fileInput.files[0];
            
            // Show preview
            const reader = new FileReader();
            reader.onload = (e) => {
                preview.innerHTML = `<img src="${e.target.result}" alt="Cover Preview">`;
            };
            reader.readAsDataURL(file);

            // Upload
            const formData = new FormData();
            formData.append('image', file);
            
            result.innerHTML = 'Uploading...';

            fetch('/unipulse/public/publisher/profile/uploadCoverPhoto', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    result.innerHTML = `
                        <div class="success">✓ ${data.message}</div>
                        <p><strong>Image URL:</strong> ${data.imageUrl}</p>
                        <img src="${data.imageUrl}" width="200" style="border:1px solid #ccc">
                    `;
                } else {
                    result.innerHTML = `<div class="error">✗ ${data.message}</div>`;
                }
            })
            .catch(error => {
                result.innerHTML = `<div class="error">✗ Error: ${error.message}</div>`;
            });
        }

        function verifyDatabase() {
            const result = document.getElementById('dbResult');
            result.innerHTML = 'Checking database...';
            
            fetch('/unipulse/public/publisher/profile/getProfileData')
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        const profile = data.data.profile;
                        result.innerHTML = `
                            <div class="success">✓ Database updated</div>
                            <p><strong>Logo URL in DB:</strong> ${profile.logo_url || 'Not set'}</p>
                            <p><strong>Cover URL in DB:</strong> ${profile.cover_photo_url || 'Not set'}</p>
                            <div style="margin-top: 10px;">
                                ${profile.logo_url ? `<div><strong>Logo:</strong><br><img src="${profile.logo_url}" width="100" style="border:1px solid #ccc"></div>` : ''}
                                ${profile.cover_photo_url ? `<div style="margin-top:10px"><strong>Cover:</strong><br><img src="${profile.cover_photo_url}" width="200" style="border:1px solid #ccc"></div>` : ''}
                            </div>
                        `;
                    } else {
                        result.innerHTML = `<div class="error">✗ ${data.message}</div>`;
                    }
                })
                .catch(error => {
                    result.innerHTML = `<div class="error">✗ Error: ${error.message}</div>`;
                });
        }
    </script>
</body>
</html>
